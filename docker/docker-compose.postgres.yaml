# PostgreSQL
#
# 用法：叠加在 docker-compose.base.yaml 之上

x-postgres-env: &postgres-env
  DATABASE_HOST: postgres
  DATABASE_PORT: '5432'
  DATABASE_USERNAME: ${DATABASE_USERNAME:-root}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-secret}
  DATABASE_NAME: ${DATABASE_NAME:-api}

services:
  postgres:
    image: postgres:18.6-alpine
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-root}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret}
      POSTGRES_DB: ${DATABASE_NAME:-api}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-root} -d ${DATABASE_NAME:-api}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  migrate:
    environment: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    environment: *postgres-env

  api:
    environment: *postgres-env

  worker:
    environment: *postgres-env

volumes:
  postgres-data:
