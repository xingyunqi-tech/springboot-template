# 各环境共用的服务：Mailpit、migrate 与 seed（一次性）、api、worker；按环境叠加 docker-compose.<env>.yaml
#
# 用法：
#   docker compose -f docker/docker-compose.base.yaml -f docker/docker-compose.postgres.yaml -f docker/docker-compose.redis.yaml up --build

name: springboot-template-dev

x-app: &app
  image: springboot-template:local
  pull_policy: never
  env_file:
    - ../.env.example
  environment: &app-env
    APP_PORT: '3000'
    AUTH_JWT_SECRET: dev_jwt_secret_0123456789abcdefghijklmnop
    AUTH_REFRESH_SECRET: dev_refresh_secret_0123456789abcdefghijklmnop
    AUTH_FORGOT_SECRET: dev_forgot_secret_0123456789abcdefghijklmnop
    AUTH_CONFIRM_EMAIL_SECRET: dev_confirm_email_secret_0123456789abcdefghijklmnop
    MAIL_HOST: mailpit
    MAIL_PORT: '1025'
    REDIS_ENABLED: 'false'

services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAIL_CLIENT_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  migrate:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: migrate
    restart: 'no'

  seed:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: seed
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      <<: *app-env
      APP_ROLE: api
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'java -XX:+UseSerialGC -Xmx16m -XX:TieredStopAtLevel=1 -cp /app/probe HealthProbe "http://localhost:$${APP_PORT:-3000}/api/v1/health/live"']
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
