spring:
  application:
    name: ${APP_NAME:springboot-template}
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:api}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:secret}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_CONNECTIONS:100}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

server:
  port: ${APP_PORT:3000}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        exclude: '*'
